[package]
name = "pipeweaver-smc-mixer"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "pipeweaver-smc-mixer"
path = "src/main.rs"

[dependencies]
pipeweaver-smc-core = { path = "../core" }
pipeweaver-ipc = { git = "https://github.com/pipeweaver/pipeweaver", tag = "v0.1.9" }
pipeweaver-shared = { git = "https://github.com/pipeweaver/pipeweaver", tag = "v0.1.9" }
pipeweaver-websocket-client = { git = "https://github.com/pauel3312/pwv-wsc-as-dep-for-pwv-midi.git", branch = "main" }
anyhow = "1"
clap = { version = "4.6.1", features = ["derive"] }
eframe = "0.37.0"
egui = "0.37.0"
egui_extras = { version = "0.37.0", features = ["svg"] }
fs2 = "0.4"
image = "0.25.10"
ksni = { version = "0.3.4", features = ["async-io"], default-features = false }
midir = "0.11.0"
ulid = "1"
log = "0.4"
simplelog = "0.12"
tokio = { version = "1.52.1", features = ["rt", "rt-multi-thread", "macros", "signal", "time", "sync"] }
